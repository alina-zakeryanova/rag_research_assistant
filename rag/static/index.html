<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <style>
    :root {
      --bg: #f3efe6;
      --panel: #fffdf8;
      --ink: #221e18;
      --muted: #6f675c;
      --line: #e3dacb;
      --accent: #1e4636;
      --accent-soft: #e4f0ea;
      --warn: #8a3d2a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      color: var(--ink);
      background: var(--bg);
    }
    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100%;
    }
    aside {
      border-right: 1px solid var(--line);
      background: #ebe4d6;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand {
      padding: 22px 20px 12px;
    }
    .brand h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; font-family: "Avenir Next", "Segoe UI", sans-serif; }
    .filter {
      margin: 0 16px 12px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font: 14px "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      width: calc(100% - 32px);
    }
    .papers { overflow: auto; padding: 0 10px 16px; }
    .paper {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      color: inherit;
      font: inherit;
    }
    .paper:hover, .paper.active { background: var(--panel); }
    .paper strong { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.3; }
    .paper span { display: block; margin-top: 2px; color: var(--muted); font: 12px "Avenir Next", "Segoe UI", sans-serif; }
    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .thread {
      flex: 1;
      overflow: auto;
      padding: 28px 8vw 16px;
    }
    .empty {
      max-width: 640px;
      margin: 8vh auto 0;
      color: var(--muted);
    }
    .empty h2 { color: var(--ink); font-weight: 600; font-size: 28px; margin: 0 0 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .chips button, .composer button, .paper {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    .chips button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chips button:hover { border-color: var(--accent); }
    .turn { max-width: 740px; margin: 0 auto 22px; }
    .ask { font-size: 18px; margin: 0 0 10px; }
    .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .meta { margin: 8px 0 0; color: var(--muted); font: 12px "Avenir Next", "Segoe UI", sans-serif; }
    .warn { color: var(--warn); font: 13px "Avenir Next", "Segoe UI", sans-serif; margin: 8px 0 0; }
    .sources { display: grid; gap: 8px; margin-top: 12px; }
    .source {
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .source b { font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 13px; }
    .source em { font-style: normal; color: var(--muted); font: 12px "Avenir Next", "Segoe UI", sans-serif; margin-left: 8px; }
    .source p { margin: 6px 0 0; color: #3d3830; font-size: 14px; line-height: 1.4; }
    .composer {
      padding: 12px 8vw 20px;
      background: linear-gradient(transparent, var(--bg) 30%);
    }
    form {
      max-width: 740px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
    }
    textarea {
      flex: 1;
      border: 0;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      padding: 8px;
      font: 16px "Iowan Old Style", Palatino, Georgia, serif;
      color: var(--ink);
      background: transparent;
      outline: none;
    }
    .composer button {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .composer button:disabled { opacity: 0.5; cursor: default; }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      .thread, .composer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <h1>Library</h1>
        <p id="count">Loading papers…</p>
      </div>
      <input class="filter" id="filter" type="search" placeholder="Filter papers" autocomplete="off">
      <div class="papers" id="papers"></div>
    </aside>
    <main>
      <div class="thread" id="thread">
        <div class="empty" id="empty">
          <h2>Ask the library.</h2>
          <p>Questions search your papers. A follow-up keeps the last topic. Click a paper to summarize it.</p>
          <div class="chips">
            <button type="button" data-q="What methods are used to detect olive oil adulteration?">Olive oil adulteration</button>
            <button type="button" data-q="How is hyperspectral imaging used?">Hyperspectral imaging</button>
            <button type="button" data-q="compare Raman spectroscopy and hyperspectral imaging for oil">Compare Raman and hyperspectral</button>
          </div>
        </div>
      </div>
      <div class="composer">
        <form id="form">
          <textarea id="box" rows="1" placeholder="Ask about the papers"></textarea>
          <button type="submit" id="send">Ask</button>
        </form>
      </div>
    </main>
  </div>
  <script>
    const thread = document.getElementById("thread");
    const empty = document.getElementById("empty");
    const box = document.getElementById("box");
    const send = document.getElementById("send");
    const papersEl = document.getElementById("papers");
    const filter = document.getElementById("filter");
    const countEl = document.getElementById("count");
    const history = [];
    let papers = [];
    let busy = false;

    function esc(value) {
      return String(value).replace(/[&<>"]/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
      }[ch]));
    }

    function renderPapers() {
      const needle = filter.value.trim().toLowerCase();
      papersEl.innerHTML = "";
      papers.filter((paper) => !needle || paper.title.toLowerCase().includes(needle) || paper.source.toLowerCase().includes(needle))
        .forEach((paper) => {
          const button = document.createElement("button");
          button.className = "paper";
          button.innerHTML = `<strong>${esc(paper.title)}</strong><span>${esc(paper.source)} · ${paper.pages} pp</span>`;
          button.addEventListener("click", () => summarize(paper.source, button));
          papersEl.appendChild(button);
        });
    }

    function addTurn(question, data) {
      empty.remove();
      const turn = document.createElement("article");
      turn.className = "turn";
      const sources = (data.sources || []).map((source) => {
        const score = source.score ? `<em>${source.score.toFixed(2)}</em>` : "";
        return `<div class="source"><b>${esc(source.title)}</b>${score}<em>p. ${source.page}</em><p>${esc(source.preview)}</p></div>`;
      }).join("");
      const text = data.answer || data.note || "No answer.";
      const warnings = (data.warnings || []).map((warning) => `<p class="warn">${esc(warning)}</p>`).join("");
      const note = data.answer && data.note ? `<p class="warn">${esc(data.note)}</p>` : "";
      const searched = data.searchQuery && data.searchQuery !== question
        ? `<p class="meta">Searched “${esc(data.searchQuery)}”</p>` : "";
      turn.innerHTML = `
        <h3 class="ask">${esc(question)}</h3>
        <div class="bubble">${esc(text)}</div>
        ${searched}
        ${note}
        ${warnings}
        <div class="sources">${sources}</div>`;
      thread.appendChild(turn);
      thread.scrollTop = thread.scrollHeight;
    }

    async function post(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    async function ask(message) {
      if (busy || !message.trim()) return;
      busy = true;
      send.disabled = true;
      addTurn(message, {
        answer: "Reading the papers.",
        sources: [],
        warnings: [],
      });
      try {
        const data = await post("/api/chat", { message, history });
        thread.removeChild(thread.lastElementChild);
        addTurn(message, data);
        if (data.answer) {
          history.push({ role: "user", content: message });
          history.push({ role: "assistant", content: data.answer });
          if (history.length > 8) history.splice(0, history.length - 8);
        }
      } catch (error) {
        thread.removeChild(thread.lastElementChild);
        addTurn(message, { answer: "", note: error.message, sources: [], warnings: [] });
      } finally {
        busy = false;
        send.disabled = false;
        box.focus();
      }
    }

    async function summarize(source, button) {
      document.querySelectorAll(".paper.active").forEach((el) => el.classList.remove("active"));
      button.classList.add("active");
      if (busy) return;
      busy = true;
      const label = `Summarize ${source}`;
      addTurn(label, {
        answer: "Reading this paper.",
        sources: [],
        warnings: [],
      });
      try {
        const data = await post("/api/summarize", { source });
        thread.removeChild(thread.lastElementChild);
        addTurn(data.question || label, data);
      } catch (error) {
        thread.removeChild(thread.lastElementChild);
        addTurn(label, { answer: "", note: error.message, sources: [], warnings: [] });
      } finally {
        busy = false;
      }
    }

    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      const message = box.value.trim();
      box.value = "";
      ask(message);
    });
    box.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.getElementById("form").requestSubmit();
      }
    });
    document.querySelectorAll(".chips button").forEach((button) => {
      button.addEventListener("click", () => ask(button.dataset.q));
    });
    filter.addEventListener("input", renderPapers);

    fetch("/api/papers").then((response) => response.json()).then((data) => {
      papers = data.papers || [];
      countEl.textContent = `${papers.length} papers · ${data.count} passages`;
      renderPapers();
    }).catch(() => {
      countEl.textContent = "Could not load the index";
    });
  </script>
</body>
</html>
